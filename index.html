<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DaComputer — Redirecting…</title>
  <meta name="description" content="Redirecting to the DaComputer developer portfolio." />

  <!-- Fallback for crawlers / no-JS -->
  <meta http-equiv="refresh" content="2; url=https://dacomputercode.dev" />

  <link rel="icon" href="https://dacomputercode.dev/DaComputerLogo.png" />

  <style>
    :root {
      --deep-purple: #1a0b2e;
      --deep-purple-2: #2d1550;
      --mid-purple: #7c3aed;
      --light-purple: #c4b5fd;
      --white: #ffffff;
      --dim: rgba(255, 255, 255, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, var(--deep-purple-2), var(--deep-purple) 65%);
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, Menlo, monospace;
      color: var(--white);
      overflow: hidden;
    }

    .console {
      width: min(480px, 88vw);
      padding: 2.25rem 2rem;
      border: 1px solid rgba(196, 181, 253, 0.25);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(6px);
    }

    .console__bar {
      display: flex;
      gap: 6px;
      margin-bottom: 1.5rem;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(196, 181, 253, 0.35);
    }

    .prompt {
      font-size: 0.85rem;
      color: var(--light-purple);
      margin: 0 0 0.5rem;
      letter-spacing: 0.01em;
    }

    .prompt span.path {
      color: var(--mid-purple);
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 500;
      line-height: 1.5;
      margin: 0 0 1.5rem;
      color: var(--white);
    }

    h1 .target {
      color: var(--light-purple);
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background: var(--light-purple);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .track {
      height: 3px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .track__fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--mid-purple), var(--light-purple));
      border-radius: 999px;
      animation: fill 2s ease-out forwards;
    }

    @keyframes fill {
      to { width: 100%; }
    }

    .fallback {
      font-size: 0.8rem;
      color: var(--dim);
      margin: 0;
    }

    .fallback a {
      color: var(--light-purple);
      text-decoration: none;
      border-bottom: 1px solid rgba(196, 181, 253, 0.35);
    }

    .fallback a:hover {
      border-bottom-color: var(--light-purple);
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .track__fill {
        animation: none;
      }
      .track__fill {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="console">
    <div class="console__bar" aria-hidden="true">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <p class="prompt"><span class="path">~/dacomputer</span> $ open portfolio</p>

    <h1>Redirecting to <span class="target">dacomputercode.dev</span><span class="cursor" aria-hidden="true"></span></h1>

    <div class="track" role="progressbar" aria-label="Redirecting">
      <div class="track__fill"></div>
    </div>

    <p class="fallback">
      Not moving? <a href="https://dacomputercode.dev">Go to the portfolio</a>
    </p>
  </main>

  <script>
    setTimeout(function () {
      window.location.replace("https://dacomputercode.dev");
    }, 2000);
  </script>
</body>
</html>
